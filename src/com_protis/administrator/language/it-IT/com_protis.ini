COM_PROTIS_DASHBOARD="PROTIS IBF - Pannello di amministrazione"
COM_PROTIS_CONFIG_SCRIVANIA="Scrivania PDF: file sul server"
COM_PROTIS_CONFIG_SCRIVANIA_DESC="Percorso completo del file index.html della Scrivania PDF (es. /var/www/protis_apps/scrivania_pdf/index.html), meglio fuori dalla cartella pubblica. Se indicato, la voce Scrivania PDF compare nel menu di tutti gli utenti collegati. Vuoto = voce nascosta."
COM_PROTIS_CONFIG_SUPPORT_NAME="Supporto: nome"
COM_PROTIS_CONFIG_SUPPORT_EMAIL="Supporto: email"
COM_PROTIS_CONFIG_SUPPORT_DESC="Referente mostrato nella pagina di accesso alla voce \"Problemi di accesso?\". Vuoto = la voce non compare."
COM_PROTIS_CONFIG_PRIVACY="Informativa sul trattamento dei dati"
COM_PROTIS_CONFIG_PRIVACY_DESC="Indirizzo del PDF dell'informativa privacy, completo (https://...) o nel sito (es. images/informativa/informativa.pdf). Vuoto = si usa l'unico PDF nella cartella images/informativa, se c'è. Il link compare nella pagina di accesso e a piè di pagina."
COM_PROTIS_CONFIG_VIDEO="Video di presentazione"
COM_PROTIS_CONFIG_VIDEO_DESC="Video MP4 mostrato nella pagina di accesso (sotto il link alla Guida) e in testa alla Guida. Percorso assoluto sul server, anche fuori dalla parte pubblica del sito (es. /var/www/protis_media/protis_ibf.mp4, leggibile dal web server), oppure relativo alla radice del sito (es. images/presentazione/protis_ibf.mp4). Il video è servito da PROTIS IBF, quindi il percorso non compare nella pagina. Se il file non c'è non compare nulla; vuoto = nessun video. Come anteprima si usa l'immagine con lo stesso nome (.jpg, .png o .webp) nella stessa cartella, se presente."
COM_PROTIS_CONFIG_APP_TEMPLATE="Interfaccia a schermo intero"
COM_PROTIS_CONFIG_APP_TEMPLATE_DESC="Usa il template PROTIS IBF (senza menu e moduli del sito) per tutte le pagine dell'app."
