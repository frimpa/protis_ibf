COM_PROTIS_CONFIG_EPAS_AUTOSYNC="Sincronizza all'apertura del mese"
COM_PROTIS_CONFIG_EPAS_AUTOSYNC_DESC="Aggiorna automaticamente le timbrature quando l'utente apre il mese corrente (oltre alla sincronizzazione notturna via cron)."
